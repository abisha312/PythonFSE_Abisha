<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h2 class="site-title">Student Portal</h2>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Profile</a></li>
            <li><a href="#">Grades</a></li>
        </ul>
    </nav>
</header>

<main>

<section id="hero">

    <h1>Welcome to the Student Portal</h1>

    <p>
        Manage your courses, grades and profile.
    </p>

    <button>Explore Courses</button>

</section>

<section class="stats-bar">

    <div class="stat-item">
        <h3>5</h3>
        <p>Courses</p>
    </div>

    <div class="stat-item">
        <h3>3.8</h3>
        <p>GPA</p>
    </div>

    <div class="stat-item">
        <h3>6</h3>
        <p>Semester</p>
    </div>

</section>

<section id="courses">
    <!-- Loading Message -->

    <p id="loading-courses" hidden>
        Loading courses...
    </p>

    <!-- Notifications -->

    <section id="notifications">

        <h2>Notifications</h2>

        <div id="notification-list">

        </div>

    </section>

    <!-- Loading Spinner -->

    <div id="loading-spinner" hidden>

        Loading notifications...

    </div>

    <!-- Error Message -->

    <div id="error-message"></div>

    <!-- Retry Button -->

    <button id="retry-btn" hidden>

        Retry

    </button>

    <h2>Available Courses</h2>

    <input
        type="text"
        id="search-courses"
        placeholder="Search courses..."
    >

    <button id="sort-btn">
        Sort by Credits
    </button>

    <div class="course-grid">

    </div>

    <p id="total-credits"></p>

    <div id="selected-course"></div>

</section>

</main>

<footer>

<p>&copy; 2026 Student Portal</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script type="module" src="app.js"></script>

</body>
</html>
